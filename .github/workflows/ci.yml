name: Backend P0
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check . ../../scripts
      - run: uv run ruff format --check . ../../scripts
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=json
      - run: uv run python scripts/check_coverage.py coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: apps/backend/coverage.json
