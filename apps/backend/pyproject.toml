[project]
name = "japanese-vocab-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "argon2-cffi>=23",
    "PyJWT>=2.9",
    "email-validator>=2",
    "python-multipart>=0.0.18",
    "jaconv>=0.4",
    "pykakasi>=2.3",
    "romkan2>=0.1.1",
    "openpyxl>=3.1",
    "sudachipy>=0.7.0",
    "sudachidict-core>=20261015",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "psycopg2-binary>=2.9",
    "ruff>=0.9",
    "psutil>=7.2.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
include = ["app/modules/*/service.py", "app/nlp/*.py"]
show_missing = true
fail_under = 70


