name: japanese-vocab-app
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vocab
      POSTGRES_USER: vocab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocab}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocab -d vocab"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://vocab:${POSTGRES_PASSWORD:-vocab}@db:5432/vocab
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env from .env.example}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      IMPORT_MODE: ${IMPORT_MODE:-async}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./apps/backend
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://vocab:${POSTGRES_PASSWORD:-vocab}@db:5432/vocab
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env from .env.example}
      IMPORT_MODE: ${IMPORT_MODE:-async}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-japanese-vocab-app_postgres_data}
    external: ${POSTGRES_VOLUME_EXTERNAL:-false}
