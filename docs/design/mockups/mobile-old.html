<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tra từ – mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B3A67}a:hover{color:#1C1C1E}
rt{font-size:0.5em;color:#6B6A66}
u{text-decoration-color:#2B3A67;text-decoration-thickness:2px;text-underline-offset:4px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F3; color: #1C1C1E; font-family: 'Be Vietnam Pro', 'Noto Sans JP', sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 12px 16px; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-bottom: 1px solid #E7E3DA">
    <button aria-label="Quay lại kết quả" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <label style="flex-grow: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: #FAF8F3; border: 1px solid #E7E3DA; border-radius: 10px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input value="緊張" aria-label="Tìm từ" style="border: 0; outline: none; background: transparent; font: inherit; font-family: 'Noto Sans JP', sans-serif; font-size: 16px; flex-grow: 1; min-width: 0">
    </label>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: flex-start; gap: 12px">
      <div style="flex-grow: 1">
        <div style="font-family: 'Noto Sans JP', sans-serif; color: #6B6A66; font-size: 14px">きんちょう · kinchou</div>
        <div style="display: flex; align-items: center; gap: 10px">
          <h1 style="margin: 0; font-family: 'Noto Serif JP', serif; font-size: 42px; font-weight: 700; line-height: 1.2">緊張</h1>
          <span style="font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #E6EFFD; color: #1D4ED8">N3</span>
        </div>
        <div style="font-weight: 600; color: #2B3A67; font-size: 14px; letter-spacing: 0.04em">《KHẨN TRƯƠNG》</div>
      </div>
      <button aria-label="Lưu vào sổ" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #2B3A67; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>
      </button>
    </div>
    <div>
      <div style="font-size: 17px">Căng thẳng, hồi hộp</div>
      <div style="display: flex; gap: 8px; margin-top: 10px">
        <button style="border: 1px solid #E7E3DA; background: #FFFFFF; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; color: #1C1C1E"><span style="font-family: 'Noto Sans JP', sans-serif">緊</span> KHẨN</button>
        <button style="border: 1px solid #E7E3DA; background: #FFFFFF; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; color: #1C1C1E"><span style="font-family: 'Noto Sans JP', sans-serif">張</span> TRƯƠNG</button>
      </div>
    </div>

    <div role="tablist" style="display: flex; gap: 2px; border-bottom: 1px solid #E7E3DA; white-space: nowrap">
      <button role="tab" aria-selected="true" style="padding: 10px 12px; border: 0; border-bottom: 2px solid #2B3A67; margin-bottom: -1px; background: none; font: inherit; font-size: 14px; font-weight: 600; color: #2B3A67">Mimikara N3</button>
      <button role="tab" aria-selected="false" style="padding: 10px 12px; border: 0; background: none; font: inherit; font-size: 14px; color: #6B6A66">Minna II</button>
      <button role="tab" aria-selected="false" style="padding: 10px 12px; border: 0; background: none; font: inherit; font-size: 14px; color: #6B6A66">+12 ví dụ</button>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E7E3DA; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 12px; color: #6B6A66">#357 · Unit 5</div>
      <div>
        <div style="font-family: 'Noto Sans JP', sans-serif; font-size: 17px; line-height: 2">① <ruby>面接<rt>めんせつ</rt></ruby>では<u><ruby>緊張<rt>きんちょう</rt></ruby>して</u>、うまく<ruby>話<rt>はな</rt></ruby>せなかった。</div>
        <div style="color: #6B6A66; font-size: 14px">→ Trong buổi phỏng vấn tôi căng thẳng nên không nói trôi chảy được.</div>
      </div>
      <div>
        <div style="font-family: 'Noto Sans JP', sans-serif; font-size: 17px; line-height: 2">② <ruby>初<rt>はじ</rt></ruby>めての<ruby>舞台<rt>ぶたい</rt></ruby>で<u><ruby>緊張<rt>きんちょう</rt></ruby></u>した。</div>
        <div style="color: #6B6A66; font-size: 14px">→ Lần đầu lên sân khấu tôi đã rất hồi hộp.</div>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap; font-family: 'Noto Sans JP', sans-serif; font-size: 14px">
        <span style="padding: 4px 10px; border: 1.5px solid #15803D; border-radius: 8px">✓ 緊張している</span>
        <span style="padding: 4px 10px; background: #EFEEEA; border-radius: 8px; color: #6B6A66">✗ <s>緊張だ</s></span>
      </div>
    </div>
  </div>

  <nav aria-label="Điều hướng chính" style="height: 68px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E7E3DA; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #2B3A67; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B3A67" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Tra từ</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B6A66; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Sổ từ</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B6A66; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Ôn tập</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B6A66; font-size: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Tài khoản</a>
  </nav>
</div>
</x-dc>

  renderVals() { return {}; }
}
</script>
</body>
</html>
